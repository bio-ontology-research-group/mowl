/*
 * Builds gateway.jar (mOWL's own Java/Groovy/Scala classes) and resolves the Java
 * libraries that mOWL ships in mowl/lib.
 *
 *   ./gradlew installLibs
 *
 * compiles gateway.jar and replaces the JAR files in ../mowl/lib with gateway.jar, the
 * jcel OWL API binding recompiled for OWL API 5 (see below) and the runtime class path
 * resolved from Maven Central. JAR files that do not come from Maven Central (the KM
 * reasoner, kobayashi-marust-*.jar) are kept.
 */

plugins {
    id 'java'
    id 'groovy'
    id 'scala'
    id 'application'
}

repositories {
    mavenCentral()
}

// The OWL API modules are declared below with literal versions (tests/owlapi checks that
// they match the JARs in mowl/lib); this value aligns their transitive requests.
def owlapiVersion = '5.5.1'
def slf4jVersion = '2.0.13'

configurations.all {
    exclude group: 'org.slf4j', module: 'slf4j-log4j12'
    // Every library below is built against the OWL API; only the module JARs declared
    // here may be on the class path. The -distribution and -osgidistribution JARs repeat
    // all classes of the modules.
    exclude group: 'net.sourceforge.owlapi', module: 'owlapi-distribution'
    exclude group: 'net.sourceforge.owlapi', module: 'owlapi-osgidistribution'
    // Needed only by ELK's proof generation (ElkProver), which mOWL does not use.
    exclude group: 'org.liveontologies', module: 'owlapi-proof'
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'net.sourceforge.owlapi'
                && details.requested.name.startsWith('owlapi-')) {
            details.useVersion owlapiVersion
        }
        // One SLF4J version (the API, the simple logger and the commons-logging bridge)
        if (details.requested.group == 'org.slf4j') {
            details.useVersion slf4jVersion
        }
    }
}

configurations {
    jcelSources { transitive = false }
}

dependencies {
    // OWL API 5, module by module
    implementation 'net.sourceforge.owlapi:owlapi-api:5.5.1'
    implementation 'net.sourceforge.owlapi:owlapi-apibinding:5.5.1'
    implementation 'net.sourceforge.owlapi:owlapi-impl:5.5.1'
    implementation 'net.sourceforge.owlapi:owlapi-parsers:5.5.1'
    implementation 'net.sourceforge.owlapi:owlapi-oboformat:5.5.1'
    implementation 'net.sourceforge.owlapi:owlapi-rio:5.5.1'
    implementation 'net.sourceforge.owlapi:owlapi-tools:5.5.1'
    implementation 'net.sourceforge.owlapi:owlapi-compatibility:5.5.1'

    // Reasoners built for OWL API 5
    implementation 'io.github.liveontologies:elk-owlapi:0.6.0'
    implementation 'net.sourceforge.owlapi:org.semanticweb.hermit:1.4.5.519'
    // EL normalisation (mowl.ontology.normalize): jcel. Its OWL API binding, jcel-owlapi
    // 0.24.1, is compiled against OWL API 4 and does not link with OWL API 5 (no newer
    // release exists), so its released sources are compiled here (source set 'jcel').
    implementation 'de.tu-dresden.inf.lat.jcel:jcel-core:0.24.1'
    implementation 'de.tu-dresden.inf.lat.jcel:jcel-coreontology:0.24.1'
    implementation 'de.tu-dresden.inf.lat.jcel:jcel-ontology:0.24.1'
    implementation 'de.tu-dresden.inf.lat.jcel:jcel-reasoner:0.24.1'
    jcelSources 'de.tu-dresden.inf.lat.jcel:jcel-owlapi:0.24.1:sources'
    // The KM reasoner (kobayashi-marust-protege5-*.jar, not on Maven Central) needs gson.
    runtimeOnly 'com.google.code.gson:gson:2.11.0'

    implementation "org.slf4j:slf4j-simple:${slf4jVersion}"
    implementation 'com.beust:jcommander:1.72'
    implementation 'org.apache.jena:apache-jena-libs:3.17.0'
    implementation 'org.codehaus.groovy:groovy-all:2.4.15'
    implementation 'org.scala-lang:scala-library:2.11.12'
    implementation 'com.github.sharispe:slib-sml:0.9.1'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 11
}

tasks.withType(ScalaCompile).configureEach {
    scalaCompileOptions.additionalParameters = ["-optimise", "-target:jvm-1.8"]
}

// The same sources give a byte-identical gateway.jar.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// jcel-owlapi 0.24.1 (LGPL 3 or Apache 2.0, https://github.com/julianmendez/jcel), compiled
// unchanged from its source JAR on Maven Central against OWL API 5.
def jcelOwlapiJarName = 'jcel-owlapi5-0.24.1.jar'
def jcelSourceDir = layout.buildDirectory.dir('jcel-owlapi-sources')

tasks.register('unpackJcelSources', Sync) {
    from { zipTree(configurations.jcelSources.singleFile) }
    into jcelSourceDir
}

sourceSets {
    jcel {
        java.srcDir(tasks.named('unpackJcelSources').map { it.destinationDir })
        compileClasspath += configurations.compileClasspath
    }
}

tasks.named('compileJcelJava') {
    dependsOn tasks.named('unpackJcelSources')
    options.compilerArgs += ['-nowarn']
}

tasks.register('jcelJar', Jar) {
    from sourceSets.jcel.output
    from(jcelSourceDir) { include 'META-INF/maven/**' }
    archiveFileName = jcelOwlapiJarName
    destinationDirectory = layout.buildDirectory.dir('libs')
}

application {
    mainClass = 'Main'
    applicationDefaultJvmArgs = ["-Dlogging.level.root=INFO"]
}

def mowlLib = file("${rootDir}/../mowl/lib")

tasks.register('installLibs') {
    group = 'distribution'
    description = 'Replaces the JAR files in ../mowl/lib with gateway.jar and its runtime class path.'
    dependsOn tasks.named('jar'), tasks.named('jcelJar')
    inputs.files(configurations.runtimeClasspath)
    doLast {
        def keep = { File f -> f.name.startsWith('kobayashi-marust') }
        mowlLib.listFiles().findAll { it.isFile() && !keep(it) }.each { it.delete() }
        copy {
            from configurations.runtimeClasspath
            include '*.jar'
            into mowlLib
        }
        copy {
            from tasks.named('jar').get().archiveFile
            into mowlLib
            rename { 'gateway.jar' }
        }
        copy {
            from tasks.named('jcelJar').get().archiveFile
            into mowlLib
        }
    }
}
