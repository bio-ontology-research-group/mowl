//compileScala {
  //  classpath = classpath.plus(files(compileGroovy.destinationDir))
 //   dependsOn compileGroovy
//}
tasks.withType(ScalaCompile) {
    scalaCompileOptions.additionalParameters = ["-optimize"]
}


// In this section you declare where to find the dependencies of your project
repositories {
    // Use 'jcenter' for resolving your dependencies.
    // You can declare any Maven/Ivy/file repository here.
//    jcenter()
    mavenCentral()
}


configurations.all {
    exclude group: 'org.slf4j', module: 'slf4j-log4j12'
}

// In this section you declare the dependencies for your production and test code
dependencies {
    implementation 'org.slf4j:slf4j-simple:2.0.13'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.beust:jcommander:1.72'
    implementation 'org.apache.jena:apache-jena-libs:3.17.0'
    implementation 'de.tu-dresden.inf.lat.jcel:jcel-owlapi:0.24.1'
    implementation 'net.sourceforge.owlapi:owlapi-distribution:5.5.1'
    implementation 'io.github.liveontologies:elk-owlapi:0.6.0'
    implementation 'net.sourceforge.owlapi:org.semanticweb.hermit:1.4.5.519'
    implementation 'org.codehaus.groovy:groovy-all:2.4.15'
    implementation 'org.scala-lang:scala-library:2.11.12'

    implementation 'com.github.sharispe:slib-sml:0.9.1'


    testImplementation 'org.scalatest:scalatest_2.11:3.0.0'
    testImplementation 'org.codehaus.groovy:groovy-all:2.4.15'
    testImplementation 'junit:junit:4.12'
}

run {
    if (project.hasProperty("appArgs")) {
        args Eval.me(appArgs)
    }
}

sourceCompatibility = '11'
targetCompatibility = '11'

mainClassName = "Main"

application {
    // JVM argument to set logging level
    applicationDefaultJvmArgs = ["-Dlogging.level.root=INFO"]
}
